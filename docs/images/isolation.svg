<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Unlocking threads: a service worker adds the isolation headers after one reload; the module then runs in a dedicated worker with its own thread pool" width="1000" height="430" style="color:#1d1d1f" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.55"/></pattern></defs><rect width="1000" height="430" fill="#ffffff"/><rect x="110" y="20" width="170" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="195.0" y="40.55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="currentColor">page (main thread)</text><line x1="195" y1="52" x2="195" y2="300" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.5"/><rect x="450" y="20" width="170" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="535.0" y="40.55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="currentColor">service worker</text><line x1="535" y1="52" x2="535" y2="300" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.5"/><rect x="790" y="20" width="170" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="875.0" y="40.55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="currentColor">GitHub Pages</text><line x1="875" y1="52" x2="875" y2="300" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.5"/><line x1="875" y1="80" x2="199" y2="80" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="535.0" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">index.html, no COOP/COEP headers</text><line x1="195" y1="116" x2="531" y2="116" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="365.0" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">register isolation_service_worker.js</text><line x1="535" y1="152" x2="199" y2="152" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="365.0" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">activate, claim → page reloads once</text><line x1="195" y1="188" x2="531" y2="188" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="365.0" y="182" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">navigation request</text><line x1="535" y1="224" x2="871" y2="224" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="705.0" y="218" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">fetch</text><line x1="535" y1="260" x2="199" y2="260" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="365.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">same response + COOP same-origin, COEP require-corp</text><rect x="40" y="312" width="300" height="104" rx="6" fill="#2f9e44" fill-opacity="0.15" stroke="currentColor" stroke-width="1"/><text x="190.0" y="352.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">crossOriginIsolated = true</text><text x="190.0" y="368.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">SharedArrayBuffer allowed</text><text x="190.0" y="384.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wasm memory can be shared</text><rect x="360" y="312" width="300" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="510.0" y="352.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">page main thread: never blocks</text><text x="510.0" y="368.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">host worker: thread 0, sleeps at</text><text x="510.0" y="384.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">barriers (Atomics.wait allowed)</text><rect x="680" y="312" width="300" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="830.0" y="352.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">thread pool, started with the module</text><text x="830.0" y="368.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">pthreads = Web Workers from</text><text x="830.0" y="384.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">mainScriptUrlOrBlob (a Blob URL)</text><line x1="340" y1="364" x2="360" y2="364" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="660" y1="364" x2="680" y2="364" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/></svg>
