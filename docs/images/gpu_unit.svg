<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="One compute pass dispatch: a workgroup per diamond, an invocation per column, a storage barrier between rows" width="1000" height="470" style="color:#1d1d1f" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.55"/></pattern></defs><rect width="1000" height="470" fill="#ffffff"/><text x="20" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">dispatchWorkgroups(5): one wave</text><rect x="20" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="43" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 0</text><rect x="72" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="95" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 1</text><rect x="124" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="147" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 2</text><rect x="176" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="199" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 3</text><rect x="228" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="251" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 4</text><text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">all workgroups run at once,</text><text x="20" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">in any order: they must not</text><text x="20" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">depend on each other</text><path d="M150,96 C 200,170 260,170 300,150" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="300" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">workgroup 2: a diamond</text><polygon points="460.0,40 620,140.0 460.0,240 300,140.0" fill="#1f6feb" fill-opacity="0.35" stroke="currentColor" stroke-width="0.8"/><line x1="320.0" y1="40" x2="320.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="340.0" y1="40" x2="340.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="360.0" y1="40" x2="360.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="380.0" y1="40" x2="380.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="400.0" y1="40" x2="400.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="420.0" y1="40" x2="420.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="440.0" y1="40" x2="440.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="460.0" y1="40" x2="460.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="480.0" y1="40" x2="480.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="500.0" y1="40" x2="500.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="520.0" y1="40" x2="520.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="540.0" y1="40" x2="540.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="560.0" y1="40" x2="560.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="580.0" y1="40" x2="580.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="600.0" y1="40" x2="600.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="300" y1="60.0" x2="620" y2="60.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="80.0" x2="620" y2="80.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="100.0" x2="620" y2="100.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="120.0" x2="620" y2="120.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="140.0" x2="620" y2="140.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="160.0" x2="620" y2="160.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="180.0" x2="620" y2="180.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="200.0" x2="620" y2="200.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="220.0" x2="620" y2="220.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="294" y1="140.0" x2="626" y2="140.0" stroke="currentColor" stroke-width="1.6"/><text x="628" y="64.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">storageBarrier()</text><text x="628" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">between rows</text><text x="364.0" y="133.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="currentColor">upper half</text><text x="364.0" y="156.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="currentColor">lower half</text><rect x="480.0" y="58.75" width="20.0" height="162.5" rx="0" fill="none" stroke="#e03131" stroke-width="2"/><text x="300" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">256 invocations = 256 columns, one cell each per row;</text><text x="300" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">the diamond widens, then narrows:</text><text x="300" y="294" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">invocations join, then drop out row by row</text><path d="M490.0,221.25 C 490.0,237.25 600,239.25 655,235.25" fill="none" stroke="#e03131" stroke-width="1.2" marker-end="url(#arrow)"/><text x="660" y="188" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">one invocation (WGSL)</text><rect x="660" y="200" width="320" height="250" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/><text x="672" y="222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">x = c - HALF + local_index</text><text x="672" y="240" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">for k in 1..rows:   upper half</text><text x="672" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">  if c - k &lt;= x &lt; c + k:</text><text x="672" y="276" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">    relax(x, r0 + k)</text><text x="672" y="294" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">  storageBarrier()</text><text x="672" y="312" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">for k in 1..rows:   lower half</text><text x="672" y="330" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">  if c-HALF+k &lt;= x &lt; c+HALF-k:</text><text x="672" y="348" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">    relax(x, r1 + k)</text><text x="672" y="366" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">  storageBarrier()</text><text x="672" y="384" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor"></text><text x="672" y="402" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">relax: best of 3 parents</text><text x="672" y="420" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor"> cost[y-1][x+d] + dist(...)</text><text x="672" y="438" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor"> → cost[y][x], prev[y][x]</text></svg>
