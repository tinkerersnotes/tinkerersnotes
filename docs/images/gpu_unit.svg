<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="One compute pass dispatch: a workgroup per tile, an invocation per column, a storage barrier between rows" width="1000" height="400" style="color:#1d1d1f" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.55"/></pattern></defs><rect width="1000" height="400" fill="#ffffff"/><text x="20" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">dispatchWorkgroups(5): one wave</text><rect x="20" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="43" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 0</text><rect x="72" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="95" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 1</text><rect x="124" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="147" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 2</text><rect x="176" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="199" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 3</text><rect x="228" y="46" width="46" height="46" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="251" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">wg 4</text><text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">all workgroups run at once,</text><text x="20" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">in any order: they must not</text><text x="20" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">depend on each other</text><path d="M150,96 C 200,170 260,170 300,150" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="300" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">workgroup 2: a downward triangle</text><polygon points="300,40 620,40 460.0,240" fill="#1f6feb" fill-opacity="0.35" stroke="currentColor" stroke-width="0.8"/><line x1="320.0" y1="40" x2="320.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="340.0" y1="40" x2="340.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="360.0" y1="40" x2="360.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="380.0" y1="40" x2="380.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="400.0" y1="40" x2="400.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="420.0" y1="40" x2="420.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="440.0" y1="40" x2="440.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="460.0" y1="40" x2="460.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="480.0" y1="40" x2="480.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="500.0" y1="40" x2="500.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="520.0" y1="40" x2="520.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="540.0" y1="40" x2="540.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="560.0" y1="40" x2="560.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="580.0" y1="40" x2="580.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="600.0" y1="40" x2="600.0" y2="240" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.18"/><line x1="300" y1="65.0" x2="620" y2="65.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="90.0" x2="620" y2="90.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="115.0" x2="620" y2="115.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="140.0" x2="620" y2="140.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="165.0" x2="620" y2="165.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="190.0" x2="620" y2="190.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><line x1="300" y1="215.0" x2="620" y2="215.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.6"/><text x="628" y="69.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">storageBarrier()</text><text x="628" y="85.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">between rows</text><rect x="480.0" y="40" width="20.0" height="124.0" rx="0" fill="none" stroke="#e03131" stroke-width="2"/><text x="300" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">256 invocations = 256 columns, one cell each per row;</text><text x="300" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">the triangle narrows, so invocations drop out row by row</text><path d="M490.0,164.0 C 520.0,300 640,310 660,230" fill="none" stroke="#e03131" stroke-width="1.2" marker-end="url(#arrow)"/><text x="660" y="138" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">one invocation (WGSL)</text><rect x="660" y="150" width="320" height="178" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/><text x="672" y="172" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">x = a + local_index</text><text x="672" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">for k in 1..rows:</text><text x="672" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">  if lo(k) &lt;= x &lt; hi(k):</text><text x="672" y="226" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">    relax(x, r0 + k)</text><text x="672" y="244" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">  storageBarrier()</text><text x="672" y="262" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor"></text><text x="672" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">relax: best of 3 parents</text><text x="672" y="298" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor"> cost[y-1][x+d] + dist(...)</text><text x="672" y="316" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor"> → cost[y][x], prev[y][x]</text></svg>
