<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="WebGPU flow: the JavaScript and C++ engines both drive the browser WebGPU API; setup once, record and submit many dispatches per shrink, read the picture back once" width="1000" height="470" style="color:#1d1d1f" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.55"/></pattern></defs><rect width="1000" height="470" fill="#ffffff"/><text x="20" y="26" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="currentColor">CPU (page)</text><text x="760" y="26" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="currentColor">GPU</text><rect x="20" y="40" width="200" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="120.0" y="59.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">JavaScript engine</text><text x="120.0" y="75.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">webgpu_seam_carver.js</text><rect x="240" y="40" width="220" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="350.0" y="59.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">C++ engine (wasm)</text><text x="350.0" y="75.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">webgpu.h → Emdawnwebgpu glue</text><rect x="120" y="120" width="280" height="34" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1"/><text x="260.0" y="141.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">navigator.gpu: the browser WebGPU API</text><line x1="120" y1="86" x2="200" y2="120" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="350" y1="86" x2="300" y2="120" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="410" y="141" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">← both engines make the same calls</text><rect x="20" y="176" width="540" height="92" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="30" y="194" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="currentColor">once</text><text x="140" y="194" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">requestAdapter → requestDevice</text><text x="140" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">createShaderModule(WGSL)</text><text x="140" y="230" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">createComputePipeline × 8</text><text x="140" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">createBuffer: pixels, cost, prev, changed, seam, state</text><rect x="20" y="280" width="540" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="30" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="currentColor">per shrink(n)</text><text x="140" y="298" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">createCommandEncoder, beginComputePass</text><text x="140" y="316" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">per seam: setPipeline, setBindGroup,</text><text x="140" y="334" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">  dispatchWorkgroups × (2 per strip + 3)</text><text x="140" y="352" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">end, queue.submit(...)</text><text x="140" y="370" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">await onSubmittedWorkDone()</text><rect x="20" y="402" width="540" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="30" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="currentColor">to display</text><text x="140" y="420" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">copyBufferToBuffer(pixels → readback)</text><text x="140" y="438" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">await mapAsync(READ)</text><text x="140" y="456" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">getMappedRange → RGB bytes</text><rect x="760" y="180" width="220" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="870.0" y="206.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">queue</text><text x="870.0" y="222.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">commands run in order</text><rect x="760" y="270" width="220" height="60" rx="6" fill="#1f6feb" fill-opacity="0.25" stroke="currentColor" stroke-width="1"/><text x="870.0" y="296.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">compute passes</text><text x="870.0" y="312.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">workgroups in parallel</text><rect x="760" y="360" width="220" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="870.0" y="386.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">buffers stay on the GPU</text><text x="870.0" y="402.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">across all seams</text><path d="M560,300 C 660,300 660,210 760,210" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="660" y="196" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">submit: 1 per shrink</text><line x1="870" y1="240" x2="870" y2="270" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="870" y1="330" x2="870" y2="360" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M760,400 C 660,410 620,430 560,430" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="660" y="456" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">one readback per picture</text></svg>
