ystem, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">(Python in build.sh)</text><text x="870.0" y="165.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor"></text><text x="870.0" y="181.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">fills the template's</text><text x="870.0" y="197.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">@@placeholders@@</text><text x="870.0" y="213.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor"></text><text x="870.0" y="229.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">seam_carver.html,</text><text x="870.0" y="245.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">one self-contained page</text><rect x="760" y="370" width="220" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="870.0" y="393.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">GitHub Pages</text><text x="870.0" y="409.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">index.html</text><text x="870.0" y="425.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">+ isolation_service_worker.js</text><line x1="870" y1="330" x2="870" y2="370" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/><text x="878" y="354" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="currentColor">Actions</text><text x="20" y="362" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">Modules go into &lt;script&gt; elements. The threaded</text><text x="20" y="378" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">module also goes in as text, so its workers can</text><text x="20" y="394" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="currentColor">start from a Blob of it.</text></svg>
