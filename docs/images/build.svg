<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Build pipeline: em++ compiles three modules with the wasm embedded, a Python step inlines them with the JavaScript engines and the sample into one HTML page" width="1000" height="470" style="color:#1d1d1f" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.55"/></pattern></defs><rect width="1000" height="470" fill="#ffffff"/><text x="20" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">sources</text><text x="270" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">em++ (Emscripten 6.0.3)</text><text x="500" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">build/</text><text x="760" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="currentColor">build.sh, then CI</text><rect x="20" y="40" width="220" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1"/><text x="130.0" y="64.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="currentColor">seam_carver_core/</text><text x="130.0" y="80.2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="currentCol