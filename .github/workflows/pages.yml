# Builds the standalone seam carver page (wasm_seam_carver/build.sh) and publishes it on
# GitHub Pages, at https://<owner>.github.io/<repo>/.
#
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish seam carver page

on:
  push:
    branches: [main]
    paths:
      - 'wasm_seam_carver/**'
      - 'seam_carver_core/**'
      - 'parallel_seam_carver/**'
      - 'tundra_1280x958.jpeg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:  # also runs from the Actions tab

permissions:
  contents: read
  pages: write     # deploy to Pages
  id-token: write  # prove to Pages that the deployment comes from this workflow

# One deployment at a time; a newer push waits instead of cancelling a deployment halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The version the page is developed and tested with (see build.sh). Its built-in Emdawnwebgpu
      # port downloads the Dawn release it pins while building the WebGPU engine in C++.
      - name: Install Emscripten 6.0.3
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.3
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.3

      - name: Build the page
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          wasm_seam_carver/build.sh

      # The page is self-contained, plus the service worker that makes it cross-origin isolated
      # for the multithreaded engine, which GitHub Pages' own headers can't
      - name: Collect the site
        run: |
          mkdir site
          cp wasm_seam_carver/seam_carver.html site/index.html
          cp wasm_seam_carver/isolation_service_worker.js site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
