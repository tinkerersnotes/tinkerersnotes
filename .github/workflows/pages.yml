# Builds the standalone demo pages and publishes them on GitHub Pages, at
# https://<owner>.github.io/<repo>/: pages/index.html, which links to the demos,
# seam_carver.html (wasm_seam_carver/build.sh), seam_terrain.html (seam_terrain/build.sh), and
# moving_points.html and box_projections.html (triangulation/, hand-written, copied as they are with
# the delaunay.js they share, and the weighted_delaunay.js box_projections.html builds on it).
#
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish demo pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'wasm_seam_carver/**'
      - 'seam_terrain/**'
      - 'seam_carver_core/**'
      - 'parallel_seam_carver/**'
      - 'tundra_1280x958.jpeg'
      - 'triangulation/moving_points.html'
      - 'triangulation/box_projections.html'
      - 'triangulation/delaunay.js'
      - 'triangulation/weighted_delaunay.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:  # also runs from the Actions tab

permissions:
  contents: read
  pages: write     # deploy to Pages
  id-token: write  # prove to Pages that the deployment comes from this workflow

# One deployment at a time; a newer push waits instead of cancelling a deployment halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # build.sh installs the Emscripten pinned in wasm_seam_carver/emscripten.sh into .emsdk/, the
      # same as on a developer's machine. Cached until that file changes, with Emscripten's own
      # cache: its system libraries and the Dawn release the Emdawnwebgpu port downloads.
      - uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('wasm_seam_carver/emscripten.sh') }}

      - name: Build the pages
        run: |
          wasm_seam_carver/build.sh
          seam_terrain/build.sh

      # The pages are self-contained, plus the service worker that makes the seam carver page
      # cross-origin isolated for its multithreaded engine, which GitHub Pages' own headers can't
      - name: Collect the site
        run: |
          mkdir site
          cp pages/index.html site/
          cp wasm_seam_carver/seam_carver.html site/
          cp seam_terrain/seam_terrain.html site/
          cp triangulation/moving_points.html triangulation/box_projections.html site/
          cp triangulation/delaunay.js triangulation/weighted_delaunay.js site/
          cp wasm_seam_carver/isolation_service_worker.js site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
