# Python dependencies of the notebooks and the seam carver modules in this repo.
# This is not an installable package: it only declares dependency groups (PEP 735).
#
# Set up everything with ./init.sh (init.cmd on Windows), which runs:
#   pip install --group notebooks --group dev -c constraints.txt    (needs pip >= 25.1)
#
# Version bounds mark the major versions the code is written for;
# constraints.txt pins the exact versions it was tested with (see update-constraints.sh).

[dependency-groups]
# Run-time dependencies of the *_seam_carver modules and cpp_seam_carver/shrink_animation.py
seam-carver = [
    "Pillow>=12",
    "wasmtime>=50",  # wasmtime_seam_carver: WebAssembly with exception handling
]

# Building the extension modules (build.sh, setup.py) and %%cython notebook cells.
# setuptools also provides distutils, which Python 3.12 removed and Cython's %%cython magic needs.
build = ["Cython>=3", "setuptools"]

notebooks = [
    {include-group = "seam-carver"},
    {include-group = "build"},
    "jupyterlab>=4",
    "matplotlib>=3",  # cython_and_ctypes.ipynb plots
    "numpy>=2",       # seam_carver.ipynb image conversions
]

# Repository tooling: nbstripout keeps notebook outputs out of commits (configure_git.py)
dev = ["nbstripout>=0.9"]
